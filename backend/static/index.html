<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkAndGears</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="viewer-panel">
        <h1>LinkAndGears</h1>
        <canvas id="mechanism-canvas" width="760" height="460" aria-label="Gear and slider mechanism"></canvas>
        <p id="status">Ready.</p>
      </section>

      <section class="controls-panel" aria-label="Mechanism controls">
        <h2>Controls</h2>
        <div>
          <button id="play-pause" type="button">Pause</button>
          <button id="reset-time" type="button">Reset time</button>
        </div>
        <label>
          Gear radius
          <input id="gear-radius" type="number" step="0.1" value="1.6" />
        </label>
        <label>
          Crank radius
          <input id="crank-radius" type="number" step="0.1" value="1.2" />
        </label>
        <label>
          Rod length
          <input id="rod-length" type="number" step="0.1" value="3.2" />
        </label>
        <label>
          Angular speed
          <input id="angular-speed" type="number" step="0.1" value="1.8" />
        </label>
        <label>
          Slider offset
          <input id="slider-offset" type="number" step="0.1" value="0" />
        </label>
        <label>
          Slider axis
          <select id="slider-axis">
            <option value="horizontal" selected>Horizontal</option>
            <option value="vertical">Vertical</option>
          </select>
        </label>

        <section class="selection-panel" aria-live="polite">
          <h2>Selection</h2>
          <p id="selection-name">No object selected</p>
          <dl id="selection-details"></dl>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
